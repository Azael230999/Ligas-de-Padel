# Config para Firebase App Hosting (https://firebase.google.com/docs/app-hosting).
#
# Este backend sirve la app completa (no solo lectura): cualquiera puede ver
# las jornadas, pero solo quien conoce ADMIN_PASSWORD puede iniciar sesión en
# /login y capturar resultados / asignar el rol de pelotas. Los datos viven en
# una base PostgreSQL real (Cloud SQL), no en un archivo efímero.
#
# DATABASE_URL y ADMIN_PASSWORD se definen como secrets de Secret Manager (no
# van en texto plano en este archivo ni en el repo). Antes de desplegar:
#   1. Crea un secret llamado "database-url" con la cadena de conexión a tu
#      instancia de Cloud SQL, por ejemplo:
#      postgresql://USUARIO:PASSWORD@IP_PUBLICA:5432/NOMBRE_DB?sslmode=require
#   2. Crea un secret llamado "admin-password" con la contraseña que quieras
#      usar para iniciar sesión como admin en la app.
#   3. Dale acceso al backend de App Hosting a ambos secrets (la consola de
#      Firebase lo pide automáticamente la primera vez que hace falta).
#
# Nota: no se pudo probar un despliegue real contra Cloud SQL en esta sesión
# (no hay credenciales de Firebase/GCP conectadas aquí). Revisa los nombres de
# los secrets y la sintaxis de este archivo contra la documentación vigente
# de App Hosting si algo no toma al desplegar.

runConfig:
  minInstances: 0
  maxInstances: 1
  cpu: 1
  memoryMiB: 512

env:
  - variable: DATABASE_URL
    secret: database-url
    availability:
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: admin-password
    availability:
      - RUNTIME
